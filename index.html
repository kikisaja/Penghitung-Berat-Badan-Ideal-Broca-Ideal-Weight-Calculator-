<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Weight Calculator ⚖️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <header class="app-header">
            <span class="badge">Broca-Calculator</span>
            <h1>⚖️ IDEAL WEIGHT CALCULATOR</h1>
            <p>Hitung estimasi berat badan idealmu menggunakan Rumus Broca!</p>
        </header>

        <!-- Form Input -->
        <form id="broca-form" class="calculator-form">
            
            <!-- Jenis Kelamin -->
            <div class="input-group">
                <label>Jenis Kelamin</label>
                <div class="gender-options">
                    <label class="gender-btn">
                        <input type="radio" name="gender" value="male" checked>
                        <span>Pria 👨</span>
                    </label>
                    <label class="gender-btn">
                        <input type="radio" name="gender" value="female">
                        <span>Wanita 👩</span>
                    </label>
                </div>
            </div>

            <!-- Tinggi Badan -->
            <div class="input-group">
                <label for="height-input">Tinggi Badan (cm)</label>
                <input type="number" id="height-input" placeholder="Contoh: 170" min="100" max="250" required>
            </div>

            <!-- Berat Badan Saat Ini (Opsional) -->
            <div class="input-group">
                <label for="current-weight">Berat Badan Sekarang (kg) <small>(opsional)</small></label>
                <input type="number" id="current-weight" placeholder="Contoh: 65" min="20" max="300" step="0.1">
            </div>

            <button type="submit" class="btn-calculate">⚡ HITUNG BERAT IDEAL</button>
        </form>

        <!-- Result Card -->
        <div class="result-card hidden" id="result-card">
            <h2>Hasil Perhitungan Broca</h2>

            <div class="result-box">
                <span class="result-title">Berat Badan Ideal (Broca)</span>
                <strong id="ideal-weight-display">0 kg</strong>
            </div>

            <div class="result-box secondary">
                <span class="result-title">Kisaran Berat Sehat (±10%)</span>
                <strong id="weight-range-display">0 kg - 0 kg</strong>
            </div>

            <div class="status-box hidden" id="status-box">
                <span id="status-text">Status: -</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
